<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.4" stop-color="#E0F2FE"/>
      <stop offset="0.72" stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="word" x1="210" y1="100" x2="760" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.58" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="stroke" x1="82" y1="0" x2="1118" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <clipPath id="rounded">
      <rect x="28" y="24" width="1144" height="592" rx="44"/>
    </clipPath>
    <style>
      .sans { font-family: Inter, Noto Sans, Segoe UI, Arial, sans-serif; }
      .mono { font-family: JetBrains Mono, Fira Code, Consolas, monospace; }
      .brand { font-size: 108px; font-weight: 950; letter-spacing: 6px; fill: url(#word); }
      .tagline { font-size: 25px; font-weight: 760; fill: #1E293B; }
      .body { font-size: 18px; fill: #475569; }
      .label { font-size: 14px; font-weight: 850; letter-spacing: 3px; fill: #6366F1; }
      .terminal { font-size: 18px; fill: #334155; }
      .prompt { font-size: 18px; fill: #2563EB; font-weight: 850; }
      .stack { font-size: 16px; font-weight: 850; fill: #1E40AF; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#F8FAFC"/>
  <g clip-path="url(#rounded)">
    <rect x="28" y="24" width="1144" height="592" rx="44" fill="url(#bg)"/>
    <circle cx="1030" cy="80" r="210" fill="#93C5FD" fill-opacity="0.58" filter="url(#blur)"/>
    <circle cx="180" cy="560" r="230" fill="#C4B5FD" fill-opacity="0.54" filter="url(#blur)"/>
    <circle cx="900" cy="500" r="180" fill="#BFDBFE" fill-opacity="0.42" filter="url(#blur)"/>

    <rect x="78" y="74" width="1044" height="492" rx="34" fill="#FFFFFF" fill-opacity="0.34" stroke="#DBEAFE" stroke-opacity="0.72"/>
    <path d="M118 130H1082" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round"/>

    <text x="118" y="235" class="sans brand">CANFLY</text>
    <text x="124" y="292" class="sans tagline">Blockchain engineer from Taiwan</text>
    <text x="124" y="334" class="sans body">Solana systems, local AI tools, and quiet automation.</text>

    <rect x="124" y="382" width="514" height="64" rx="32" fill="#DBEAFE" fill-opacity="0.42" stroke="#93C5FD" stroke-opacity="0.78"/>
    <text x="158" y="422" class="mono stack">RUST / PYTHON / TYPESCRIPT / SOLANA / LINUX</text>

    <rect x="748" y="214" width="290" height="218" rx="26" fill="#EEF2FF" fill-opacity="0.42" stroke="#C7D2FE" stroke-opacity="0.72"/>
    <text x="780" y="258" class="mono label">FOCUS</text>
    <text x="780" y="304" class="mono prompt">&gt; systems</text>
    <text x="780" y="336" class="mono terminal">solana / rust</text>
    <text x="780" y="382" class="mono prompt">&gt; ai</text>
    <text x="780" y="414" class="mono terminal">local-first</text>

    <rect x="124" y="492" width="914" height="2" rx="1" fill="url(#stroke)" opacity="0.72"/>
    <text x="124" y="530" class="mono label">VOICE AI</text>
    <text x="270" y="530" class="mono label">DEVELOPER TOOLS</text>
    <text x="492" y="530" class="mono label">WORKFLOW AUTOMATION</text>
  </g>
</svg>
