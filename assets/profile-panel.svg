<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="0.36" stop-color="#DBEAFE"/>
      <stop offset="0.68" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="ink" x1="150" y1="90" x2="850" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="0.48" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="line" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.54" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#312E81" flood-opacity="0.22"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.376 0 0 0 0 0.647 0 0 0 0 0.98 0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#1D4ED8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="rounded">
      <rect x="26" y="24" width="1148" height="672" rx="42"/>
    </clipPath>
    <style>
      .mono { font-family: JetBrains Mono, Fira Code, Consolas, monospace; }
      .sans { font-family: Inter, Noto Sans, Segoe UI, Arial, sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 4px; fill: #4F46E5; }
      .title { font-size: 96px; font-weight: 900; letter-spacing: 8px; fill: url(#ink); }
      .subtitle { font-size: 24px; font-weight: 700; fill: #1E293B; }
      .body { font-size: 18px; fill: #475569; }
      .label { font-size: 15px; font-weight: 800; letter-spacing: 3px; fill: #6366F1; }
      .cardTitle { font-size: 23px; font-weight: 850; fill: #172554; }
      .cardText { font-size: 16px; fill: #475569; }
      .stack { font-size: 18px; font-weight: 800; fill: #1E3A8A; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#F8FAFC"/>
  <g clip-path="url(#rounded)">
      <rect x="26" y="24" width="1148" height="672" rx="42" fill="url(#bg)"/>
      <rect x="26" y="24" width="1148" height="672" rx="42" fill="url(#grid)"/>
      <circle cx="1005" cy="116" r="220" fill="#BFDBFE" fill-opacity="0.72"/>
      <circle cx="103" cy="618" r="240" fill="#DDD6FE" fill-opacity="0.78"/>
      <circle cx="820" cy="620" r="160" fill="#93C5FD" fill-opacity="0.28"/>
      <path d="M88 102H1112" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>

      <text x="100" y="168" class="mono eyebrow">CANFLY1019</text>
      <text x="94" y="264" class="sans title">CANFLY</text>
      <text x="104" y="314" class="sans subtitle">Blockchain engineer from Taiwan</text>
      <text x="104" y="354" class="sans body">Solana systems, local AI tools, and workflow automation.</text>

      <rect x="92" y="396" width="740" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.56" stroke="#93C5FD"/>
      <text x="122" y="426" class="mono stack">RUST / PYTHON / TYPESCRIPT / SOLANA / LINUX</text>

      <rect x="92" y="482" width="316" height="156" rx="28" fill="#FFFFFF" fill-opacity="0.72" stroke="#BFDBFE"/>
      <text x="124" y="524" class="mono label">VOICE AI</text>
      <text x="124" y="562" class="sans cardTitle">Local Input</text>
      <text x="124" y="596" class="sans cardText">Whisper transcription.</text>
      <text x="124" y="622" class="sans cardText">Lightweight polish.</text>

      <rect x="442" y="482" width="316" height="156" rx="28" fill="#FFFFFF" fill-opacity="0.72" stroke="#C4B5FD"/>
      <text x="474" y="524" class="mono label">SYSTEMS</text>
      <text x="474" y="562" class="sans cardTitle">Solana / Rust</text>
      <text x="474" y="596" class="sans cardText">Protocol experiments.</text>
      <text x="474" y="622" class="sans cardText">Developer tooling.</text>

      <rect x="792" y="482" width="316" height="156" rx="28" fill="#FFFFFF" fill-opacity="0.72" stroke="#BFDBFE"/>
      <text x="824" y="524" class="mono label">WORKFLOW</text>
      <text x="824" y="562" class="sans cardTitle">Linux Utilities</text>
      <text x="824" y="596" class="sans cardText">Small automations.</text>
      <text x="824" y="622" class="sans cardText">Daily speed.</text>

      <path d="M92 666H1108" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55"/>
      <text x="600" y="688" text-anchor="middle" class="mono body">small tools / fast systems / local-first ai</text>
  </g>
</svg>
