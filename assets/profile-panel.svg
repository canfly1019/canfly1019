<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.42" stop-color="#111827"/>
      <stop offset="0.7" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.231 0 0 0 0 0.51 0 0 0 0 0.965 0 0 0 0.42 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="520" rx="32"/>
    </clipPath>
    <style>
      .mono { font-family: JetBrains Mono, Fira Code, Consolas, monospace; }
      .title { font-size: 26px; font-weight: 800; fill: #F8FAFC; letter-spacing: 1px; }
      .label { font-size: 15px; font-weight: 700; fill: #93C5FD; letter-spacing: 2px; }
      .text { font-size: 20px; fill: #CBD5E1; }
      .muted { font-size: 17px; fill: #94A3B8; }
      .chip { font-size: 16px; font-weight: 700; fill: #DBEAFE; }
    </style>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="520" rx="32" fill="url(#panelBg)"/>
    <circle cx="1040" cy="70" r="170" fill="#2563EB" fill-opacity="0.18"/>
    <circle cx="125" cy="425" r="190" fill="#4F46E5" fill-opacity="0.16"/>
    <path d="M0 74H1200" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.9"/>
    <rect x="44" y="40" width="14" height="14" rx="7" fill="#60A5FA"/>
    <rect x="68" y="40" width="14" height="14" rx="7" fill="#818CF8"/>
    <rect x="92" y="40" width="14" height="14" rx="7" fill="#C4B5FD"/>
    <text x="600" y="55" text-anchor="middle" class="mono muted">canfly@github / builder profile</text>

    <rect x="54" y="110" width="520" height="174" rx="22" fill="#0F172A" fill-opacity="0.72" stroke="#334155"/>
    <text x="84" y="152" class="mono label">IDENTITY</text>
    <text x="84" y="195" class="mono title">Blockchain engineer from Taiwan</text>
    <text x="84" y="232" class="mono text">Solana systems, local AI tools, and Linux-native workflow automation.</text>
    <text x="84" y="260" class="mono muted">Small tools. Fast loops. Low friction.</text>

    <rect x="626" y="110" width="520" height="174" rx="22" fill="#0F172A" fill-opacity="0.72" stroke="#334155"/>
    <text x="656" y="152" class="mono label">CURRENT BUILD</text>
    <text x="656" y="195" class="mono title">Voxkeys</text>
    <text x="656" y="232" class="mono text">Fast voice input with local Whisper and AI polish.</text>
    <text x="656" y="260" class="mono muted">Compact desktop UI, tuned for writing speed.</text>

    <rect x="54" y="324" width="1092" height="128" rx="22" fill="#0F172A" fill-opacity="0.72" stroke="#334155"/>
    <text x="84" y="367" class="mono label">STACK</text>
    <g filter="url(#softGlow)">
      <rect x="84" y="390" width="84" height="36" rx="18" fill="#1D4ED8" fill-opacity="0.32" stroke="#60A5FA"/>
      <text x="126" y="414" text-anchor="middle" class="mono chip">Rust</text>
      <rect x="184" y="390" width="104" height="36" rx="18" fill="#1D4ED8" fill-opacity="0.24" stroke="#60A5FA"/>
      <text x="236" y="414" text-anchor="middle" class="mono chip">Python</text>
      <rect x="304" y="390" width="144" height="36" rx="18" fill="#312E81" fill-opacity="0.38" stroke="#818CF8"/>
      <text x="376" y="414" text-anchor="middle" class="mono chip">TypeScript</text>
      <rect x="464" y="390" width="108" height="36" rx="18" fill="#312E81" fill-opacity="0.38" stroke="#818CF8"/>
      <text x="518" y="414" text-anchor="middle" class="mono chip">Solana</text>
      <rect x="588" y="390" width="92" height="36" rx="18" fill="#1D4ED8" fill-opacity="0.24" stroke="#60A5FA"/>
      <text x="634" y="414" text-anchor="middle" class="mono chip">Linux</text>
      <rect x="696" y="390" width="82" height="36" rx="18" fill="#312E81" fill-opacity="0.38" stroke="#818CF8"/>
      <text x="737" y="414" text-anchor="middle" class="mono chip">Bash</text>
    </g>
    <text x="1018" y="414" text-anchor="middle" class="mono muted">github.com/canfly1019</text>
  </g>
</svg>
